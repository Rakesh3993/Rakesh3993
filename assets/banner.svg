<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#080d18"/><stop offset=".5" stop-color="#111b35"/><stop offset="1" stop-color="#07111f"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#ec4899"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#7c8db5" stroke-opacity=".08"/>
</pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#35D9FF"/>
  <stop offset="100%" stop-color="#7C6CFF"/>
</linearGradient>
<linearGradient id="roleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#dce6ff"/>
  <stop offset="50%" stop-color="#aebfff"/>
  <stop offset="100%" stop-color="#dce6ff"/>
</linearGradient>
</defs>

<rect width="1200" height="360" fill="#070b14"/>
<rect x="18" y="18" width="1164" height="324" rx="28" fill="url(#bg)" stroke="#263554" stroke-width="2"/>
<rect x="18" y="18" width="1164" height="324" rx="28" fill="url(#grid)"/>

<!-- moving ambient lights -->
<circle cx="150" cy="90" r="70" fill="#00d9ff" opacity=".08">
<animate attributeName="cx" values="150;320;150" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1040" cy="270" r="80" fill="#8b5cf6" opacity=".09">
<animate attributeName="cx" values="1040;870;1040" dur="7s" repeatCount="indefinite"/>
</circle>

<!-- code window -->
<circle cx="68" cy="55" r="5" fill="#ff5f56"/>
<circle cx="86" cy="55" r="5" fill="#ffbd2e"/>
<circle cx="104" cy="55" r="5" fill="#27c93f"/>

<!-- floating code -->
<g font-family="monospace" font-size="16" fill="#62d9ff" opacity=".55">
<text x="75" y="125">{ }</text><text x="1040" y="115">&lt;/&gt;</text>
<text x="102" y="285">01</text><text x="1060" y="290">01</text>
<text x="250" y="95">;</text><text x="930" y="310">{ }</text>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3s" repeatCount="indefinite"/>
</g>

<!-- title -->
<text x="600" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
font-size="58" font-weight="700" fill="url(#nameGradient)">Rakesh Kumar</text>

<text x="600" y="210" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
font-size="28" font-weight="600" fill="url(#roleGradient)">Software Developer</text>

<!-- blinking cursor -->
<rect x="815" y="184" width="3" height="31" fill="#00d9ff">
<animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
</rect>

<!-- animated waveform -->
<path d="M55 292 C180 270 250 315 370 292 S590 270 700 292 S920 315 1145 285"
fill="none" stroke="#1d2d4a" stroke-width="2"/>
<path d="M55 292 C180 270 250 315 370 292 S590 270 700 292 S920 315 1145 285"
fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"
stroke-dasharray="35 18" filter="url(#glow)">
<animate attributeName="stroke-dashoffset" from="0" to="-106" dur="1.2s" repeatCount="indefinite"/>
</path>

<circle cx="85" cy="320" r="5" fill="#22c55e">
<animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/>
</circle>
<text x="100" y="326" font-family="monospace" font-size="14" fill="#8ea4c7">AVAILABLE FOR BUILDING</text>
<text x="1115" y="326" text-anchor="end" font-family="monospace" font-size="14" fill="#53698d">&lt;code /&gt;</text>
</svg>
<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main gradient -->
    <linearGradient id="background"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" stop-color="#A56616"/>
      <stop offset="45%" stop-color="#8C4932"/>
      <stop offset="100%" stop-color="#76235B"/>
    </linearGradient>

    <!-- Bottom gradient -->
    <linearGradient id="bottom"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" stop-color="#3B241B"/>
      <stop offset="50%" stop-color="#522D27"/>
      <stop offset="100%" stop-color="#291525"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="5"
                    stdDeviation="8"
                    flood-opacity="0.35"/>
    </filter>

  </defs>


  <!-- ========================= -->
  <!-- MAIN BACKGROUND -->
  <!-- ========================= -->

  <rect width="1200"
        height="360"
        fill="#0D1117"/>


  <!-- Main banner -->
  <path
    d="M20 35
       H1180
       V285
       C1000 265 850 250 600 260
       C350 270 180 275 20 300
       Z"
    fill="url(#background)"
    filter="url(#shadow)"
  />


  <!-- ========================= -->
  <!-- TOP DECORATION -->
  <!-- ========================= -->

  <line x1="50" y1="25"
        x2="1150" y2="25"
        stroke="#DFFBFF"
        stroke-width="2"/>

  <line x1="250" y1="25"
        x2="650" y2="25"
        stroke="#7167FF"
        stroke-width="3"
        filter="url(#glow)"/>

  <line x1="650" y1="25"
        x2="1000" y2="25"
        stroke="#4CC9FF"
        stroke-width="3"
        filter="url(#glow)"/>


  <!-- ========================= -->
  <!-- NAME -->
  <!-- ========================= -->

  <text
    x="600"
    y="145"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700">

    Rakesh Kumar

  </text>


  <!-- ========================= -->
  <!-- JOB TITLE -->
  <!-- ========================= -->

  <text
    x="600"
    y="205"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="600">

    Java Full Stack Developer

  </text>


  <!-- ========================= -->
  <!-- TECH STACK -->
  <!-- ========================= -->

  <text
    x="600"
    y="245"
    text-anchor="middle"
    fill="#E8E8E8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">

    Java • Spring Boot • React • MySQL

  </text>


  <!-- ========================= -->
  <!-- BOTTOM WAVE -->
  <!-- ========================= -->

  <path
    d="M20 300
       C200 270 400 250 600 260
       C800 270 1000 250 1180 285
       L1180 315
       C1000 285 800 300 600 295
       C400 290 200 300 20 320
       Z"
    fill="url(#bottom)"
    opacity="0.9"
  />


  <!-- ========================= -->
  <!-- BOTTOM GLOW LINE -->
  <!-- ========================= -->

  <line
    x1="50"
    y1="335"
    x2="1150"
    y2="335"
    stroke="#DFFBFF"
    stroke-width="2"/>

  <line
    x1="250"
    y1="335"
    x2="700"
    y2="335"
    stroke="#6868FF"
    stroke-width="3"
    filter="url(#glow)"/>

  <line
    x1="700"
    y1="335"
    x2="1000"
    y2="335"
    stroke="#50CFFF"
    stroke-width="3"
    filter="url(#glow)"/>


  <!-- ========================= -->
  <!-- SMALL DECORATIVE DOTS -->
  <!-- ========================= -->

  <circle cx="80" cy="60" r="3"
          fill="#FFFFFF"
          opacity="0.7"/>

  <circle cx="1120" cy="65" r="3"
          fill="#FFFFFF"
          opacity="0.7"/>

  <circle cx="1050" cy="110" r="2"
          fill="#FFFFFF"
          opacity="0.5"/>

  <circle cx="150" cy="105" r="2"
          fill="#FFFFFF"
          opacity="0.5"/>

</svg>
